<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | PhotoWizard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f6f5fb; --fg: #1a1530; --muted: #5b5670; --accent: #6d4aff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #110f1a; --fg: #f4f2fb; --muted: #a9a3c0; --accent: #a58bff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      img { width: 88px; height: 88px; }
      h1 { margin: 1.25rem 0 0.5rem; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0 0 1.5rem; color: var(--muted); }
      a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 0.75rem; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="88" height="88" />
      <h1>This page does not exist</h1>
      <p>The link may be broken or the page may have moved.</p>
      <a href="/">Open PhotoWizard</a>
    </main>
  </body>
</html>
