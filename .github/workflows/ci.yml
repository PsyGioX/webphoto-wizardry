name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Audit, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependencies cannot run install scripts on the runner.
      - run: npm ci --ignore-scripts

      # Fails the build when any installed package has a known advisory (moderate or higher).
      - run: npm audit --audit-level=moderate

      # Verifies registry signatures and provenance attestations of every installed package.
      - run: npm audit signatures

      - run: npm run lint
      - run: npm run test
      - run: npm run build
